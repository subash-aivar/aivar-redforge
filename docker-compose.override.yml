services:
  backend:
    build:
      target: base
    command: >
      sh -c "pip install -e . &&
             uvicorn redforge.app:create_app --factory --reload --host 0.0.0.0 --port 8000"
    volumes:
      - ./backend/src:/app/src
      - ./backend/alembic.ini:/app/alembic.ini
    environment:
      REDFORGE_DEBUG: "true"
      REDFORGE_LOG_FORMAT: "console"
      REDFORGE_LOG_LEVEL: "DEBUG"
      # Platform Super Admin bootstrap is intentionally NOT enabled here.
      # To provision the first platform Super Admin against this stack,
      # set REDFORGE_PLATFORM_BOOTSTRAP_ENABLED=true and
      # REDFORGE_PLATFORM_BOOTSTRAP_PRINCIPAL_EMAIL=<email> in a local,
      # untracked override (e.g. `docker compose run -e ...` or a
      # docker-compose.local.yml you do not commit), restart the backend
      # service, complete the steps in
      # docs/RUNBOOK_PLATFORM_SUPER_ADMIN_BOOTSTRAP.md, then unset both
      # vars and restart again.
