[tool.mypy]
python_version = "3.14"
strict = true
warn_return_any = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = [
    "redforge.infrastructure.database.migrations.*",
    "redforge.application.auth",
    "redforge.application.ai_targets",
    "redforge.application.organizations",
]
disallow_untyped_defs = false
ignore_errors = true

[[tool.mypy.overrides]]
module = ["redis", "redis.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["yaml", "yaml.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["maxminddb", "maxminddb.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "ldap3.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["boto3.*", "botocore.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
