[project]
name = "redforge"
version = "0.1.0"
description = "AIVAR RedForge — Continuous AI Security Validation Platform"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "AIVAR", email = "engineering@aivar.io" }]
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.34,<1.0",
    "pydantic>=2.10,<3.0",
    "pydantic-settings>=2.7,<3.0",
    "structlog>=24.4,<27.0",
    "httpx>=0.28,<1.0",
    "python-ulid>=3.0,<4.0",
    "sqlalchemy[asyncio]>=2.0,<3.0",
    "asyncpg>=0.30,<1.0",
    "alembic>=1.14,<2.0",
    "prometheus-client>=0.20,<1.0",
    "argon2-cffi>=25.1,<26.0",
    "PyJWT[crypto]>=2.8,<3.0",
    "pyotp>=2.9,<3.0",
    "cryptography>=43.0,<50.0",
    "opentelemetry-api>=1.20,<2.0",
    "opentelemetry-sdk>=1.20,<2.0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.20,<2.0",
    "opentelemetry-instrumentation-fastapi>=0.40b0",
    "opentelemetry-instrumentation-sqlalchemy>=0.40b0",
    "opentelemetry-instrumentation-httpx>=0.40b0",
    "ldap3>=2.9,<3.0",
    "pyasn1>=0.4,<0.5",  # ldap3 2.9's asn1 encoder uses pyasn1's pre-0.5 tagMap/typeMap API
    "boto3>=1.34,<2.0",
    "maxminddb>=2.6,<4.0",  # reads an operator-supplied local GeoLite2 .mmdb file; we never bundle or auto-download the database itself (MaxMind EULA)
    "PyYAML>=6.0,<7.0",  # M26 CSPM policy library (YAML definitions)
    "redis>=5.0,<6.0",  # M29 execution kill switch / rate limit (redis.asyncio)
    "croniter>=2.0,<3.0",  # M30 Phase 4 recurring campaign cron expression parsing
    "numpy>=2.0,<3.0",  # M33 analytics anomaly detection + ML features
    "scikit-learn>=1.5,<2.0",  # M33 ml_pipeline (Isolation Forest, Random Forest, Linear Regression)
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<10.0",
    "pytest-asyncio>=0.25,<2.0",
    "pytest-cov>=6.0,<7.0",
    "httpx>=0.28,<1.0",
    "aiosqlite>=0.20,<1.0",
    "ruff>=0.8,<1.0",
    "mypy>=1.14,<2.0",
    "types-PyYAML>=6.0",
]

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"redforge.infrastructure.cloud_security" = ["cspm_policies/**/*.yaml", "cspm_policies/**/*.yml", "cspm_policies/**/*.json"]
"vulnerability" = ["py.typed"]
"detection" = ["py.typed"]
"engagement" = ["py.typed"]
"operation" = ["py.typed"]
"execution" = ["py.typed"]
"red_team_operator" = ["py.typed"]
"evidence" = ["py.typed"]
"payload" = ["py.typed"]
"campaign" = ["py.typed"]
"ai_posture" = ["py.typed"]
"ai_supply_chain" = ["py.typed"]
"ai_agent_governance" = ["py.typed"]
"exposure" = ["py.typed"]
"remediation_impact" = ["py.typed"]
"exposure_reporting" = ["py.typed"]
"analytics" = ["py.typed"]
"reporting" = ["py.typed"]
"ml_pipeline" = ["py.typed"]
"lessons_learned" = ["py.typed"]
"regulatory_notification" = ["py.typed"]
"incident" = ["py.typed"]
"playbook" = ["py.typed"]
"automated_action" = ["py.typed"]
"integration_hub" = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: marks tests requiring PostgreSQL",
]
filterwarnings = [
    "error",
    "ignore::starlette.exceptions.StarletteDeprecationWarning",
    "ignore::DeprecationWarning:pytest_asyncio",
    "ignore::jwt.warnings.InsecureKeyLengthWarning",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "TCH",  # flake8-type-checking
    "RUF",  # ruff-specific
]

[tool.ruff.lint.isort]
known-first-party = ["redforge", "credential_vault", "vulnerability", "detection", "engagement", "operation", "execution", "red_team_operator", "evidence", "payload", "campaign", "ai_posture", "ai_supply_chain", "ai_agent_governance", "exposure", "remediation_impact", "exposure_reporting", "analytics", "reporting", "ml_pipeline", "incident", "regulatory_notification", "lessons_learned", "playbook", "automated_action", "integration_hub"]

[tool.ruff.lint.per-file-ignores]
"src/redforge/api/**" = ["B008", "TC001", "TC003"]  # FastAPI Depends()/Annotated deps need runtime types
"src/redforge/domain/cloud_security/**" = ["TC001", "TC003"]  # Domain aggregates/ports use referenced types at runtime
