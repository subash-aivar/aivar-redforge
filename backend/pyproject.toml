    "azure.*",
    "azure.identity.*",
    "azure.mgmt.*",
    "google.*",
    "google.cloud.*",
    "google.oauth2.*",
    "googleapiclient.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["sklearn", "sklearn.*"]
