version: 1.0.0
enabled: true
evaluation_strategy: boolean
metadata:
  category: kubernetes
  tags: [host_ipc, pss]
compliance_mapping:
- framework_key: cis_benchmarks_v8
  requirement_ref: '5.2.3'
remediation:
  description: Disable hostIPC on the pod spec.
id: CSPM-K8S-HOST-IPC-001
rule_id: K8S_HOST_IPC
title: Host IPC namespace shared
description: Workload uses hostIPC.
severity: HIGH
provider_types: ["*"]
asset_types: [K8S_WORKLOAD]
rule:
  op: eq
  path: normalized_config.host_ipc
  value: true
