version: 1.0.0
enabled: true
evaluation_strategy: boolean
metadata:
  category: kubernetes
  tags: [host_pid, pss]
compliance_mapping:
- framework_key: cis_benchmarks_v8
  requirement_ref: '5.2.2'
remediation:
  description: Disable hostPID on the pod spec.
id: CSPM-K8S-HOST-PID-001
rule_id: K8S_HOST_PID
title: Host PID namespace shared
description: Workload uses hostPID.
severity: HIGH
provider_types: ["*"]
asset_types: [K8S_WORKLOAD]
rule:
  op: eq
  path: normalized_config.host_pid
  value: true
