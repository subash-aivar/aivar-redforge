version: 1.0.0
enabled: true
evaluation_strategy: boolean
metadata:
  category: storage
  tags:
  - encryption
  - kms
  mitre_techniques:
  - T1530
  cwe_ids:
  - CWE-311
compliance_mapping:
- framework_key: cis_benchmarks_v8
  requirement_ref: '3.3'
- framework_key: soc2_type2
  requirement_ref: CC6.1
remediation:
  description: Remediate the misconfiguration.
  manual_steps:
  - Review resource configuration
  - Apply least privilege
  terraform_guidance: Update resource to enforce secure defaults.
id: CSPM-AWS-S3-003
rule_id: S3_MISSING_KMS
title: S3 encrypted without KMS key
description: Encryption expected but kms_key_id is missing.
severity: MEDIUM
provider_types:
- AWS
asset_types:
- S3_BUCKET
rule:
  all:
  - op: eq
    path: normalized_config.encryption_at_rest
    value: true
  - op: not_exists
    path: normalized_config.kms_key_id
