services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      REDFORGE_DEBUG: "true"
      REDFORGE_ENVIRONMENT: "development"
      REDFORGE_DATABASE_URL: "postgresql+asyncpg://redforge:redforge@postgres:5432/redforge"
      REDFORGE_LOG_LEVEL: "DEBUG"
      REDFORGE_LOG_FORMAT: "console"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: "http://localhost:8000"
    depends_on:
      - backend
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: redforge
      POSTGRES_PASSWORD: redforge
      POSTGRES_DB: redforge
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U redforge"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
