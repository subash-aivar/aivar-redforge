name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  REDFORGE_ENVIRONMENT: "test"
  REDFORGE_LOG_FORMAT: "console"
  REDFORGE_JWT_SECRET: "ci-test-secret-key-minimum-32-characters!"
  REDFORGE_DATABASE_URL: "postgresql+asyncpg://redforge:redforge@localhost:5432/redforge_test"

jobs:
  # ─── Stage 1: Fast Checks (fail fast) ────────────────────────────────────
  lint:
    name: "Lint & Format"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install ruff
        run: pip install ruff

      - name: Ruff lint
        run: ruff check src/ tests/

      - name: Ruff format check
        run: ruff format --check src/ tests/

  typecheck:
    name: "Type Check (mypy)"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Mypy strict check
        run: mypy src/redforge/ --ignore-missing-imports

  # ─── Stage 2: Tests ──────────────────────────────────────────────────────
  test-unit:
    name: "Unit Tests"
    runs-on: ubuntu-latest
    needs: [lint, typecheck]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run unit tests with coverage
        run: |
          pip install pytest-cov
          python -m pytest tests/unit/ -v --tb=short \
            --cov=redforge --cov-report=xml --cov-report=term-missing

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-unit
          path: backend/coverage.xml

  test-integration:
    name: "Integration Tests (PostgreSQL)"
    runs-on: ubuntu-latest
    needs: [lint, typecheck]
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: redforge
          POSTGRES_PASSWORD: redforge
          POSTGRES_DB: redforge_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run Alembic migrations
        run: alembic upgrade head

      - name: Verify migration rollback
        run: |
          alembic downgrade base
          alembic upgrade head

      - name: Run integration tests
        run: python -m pytest tests/integration/ tests/api/ -v --tb=short

  test-all:
    name: "Full Test Suite"
    runs-on: ubuntu-latest
    needs: [lint, typecheck]
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: redforge
          POSTGRES_PASSWORD: redforge
          POSTGRES_DB: redforge_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install dependencies
        run: pip install -e ".[dev]" pytest-cov

      - name: Run full test suite with coverage
        run: |
          python -m pytest tests/ -v --tb=short \
            --cov=redforge --cov-report=xml --cov-report=term-missing \
            --cov-fail-under=60

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-full
          path: backend/coverage.xml

  # ─── Stage 3: Migrations ────────────────────────────────────────────────
  migrations:
    name: "Migration Validation"
    runs-on: ubuntu-latest
    needs: [lint]
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: redforge
          POSTGRES_PASSWORD: redforge
          POSTGRES_DB: redforge_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install dependencies
        run: pip install -e .

      - name: Upgrade to head
        run: alembic upgrade head

      - name: Downgrade to base
        run: alembic downgrade base

      - name: Re-upgrade (idempotency)
        run: alembic upgrade head

      - name: Verify current revision
        run: alembic current

  # ─── Stage 4: Docker ─────────────────────────────────────────────────────
  docker:
    name: "Docker Build & Verify"
    runs-on: ubuntu-latest
    needs: [test-all, migrations]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: |
          docker build -t redforge-backend:ci \
            --build-arg BUILDKIT_INLINE_CACHE=1 .

      - name: Verify image size
        run: docker images redforge-backend:ci --format "{{.Size}}"

      - name: Start container
        run: |
          docker run -d --name redforge-test \
            -p 8000:8000 \
            -e REDFORGE_DATABASE_URL=sqlite+aiosqlite:// \
            -e REDFORGE_ENVIRONMENT=test \
            -e REDFORGE_JWT_SECRET=ci-test-secret-32-chars-minimum! \
            redforge-backend:ci
          sleep 5

      - name: Verify health endpoint
        run: |
          curl -sf http://localhost:8000/api/v1/health/live | jq .
          curl -sf http://localhost:8000/api/v1/health | jq .

      - name: Verify metrics endpoint
        run: curl -sf http://localhost:8000/api/v1/metrics | head -5

      - name: Verify non-root execution
        run: |
          USER=$(docker exec redforge-test whoami)
          echo "Running as: $USER"
          [ "$USER" = "redforge" ] || exit 1

      - name: Graceful shutdown
        run: |
          docker stop --time 10 redforge-test
          EXIT_CODE=$(docker inspect redforge-test --format '{{.State.ExitCode}}')
          echo "Exit code: $EXIT_CODE"
          [ "$EXIT_CODE" = "0" ] || exit 1

      - name: Cleanup
        if: always()
        run: docker rm -f redforge-test 2>/dev/null || true

  # ─── Stage 5: OpenAPI Validation ─────────────────────────────────────────
  openapi:
    name: "OpenAPI Schema Validation"
    runs-on: ubuntu-latest
    needs: [lint]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install dependencies
        run: pip install -e .

      - name: Generate OpenAPI schema
        run: |
          python -c "
          import json
          from redforge.app import create_app
          from redforge.core.config import Settings
          settings = Settings(database_url='sqlite+aiosqlite://')
          app = create_app(settings)
          schema = app.openapi()
          with open('openapi.json', 'w') as f:
              json.dump(schema, f, indent=2)
          print(f'Endpoints: {len(schema[\"paths\"])}')
          print(f'Version: {schema[\"info\"][\"version\"]}')
          "

      - name: Validate OpenAPI 3.x compliance
        run: |
          pip install openapi-spec-validator
          python -c "
          from openapi_spec_validator import validate
          import json
          with open('openapi.json') as f:
              spec = json.load(f)
          validate(spec)
          print('OpenAPI schema is valid')
          "

      - name: Upload schema artifact
        uses: actions/upload-artifact@v4
        with:
          name: openapi-schema
          path: backend/openapi.json

  # ─── Stage 6: Security Scanning ──────────────────────────────────────────
  security:
    name: "Security Scan"
    runs-on: ubuntu-latest
    needs: [lint]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Dependency audit (pip-audit)
        run: |
          pip install pip-audit
          # No `|| true`: a known vulnerability in a dependency must fail
          # the build, not be silently logged and ignored. If a specific
          # finding is a reviewed, accepted risk, suppress it explicitly
          # with `--ignore-vuln <ID>` (documented, auditable) rather than
          # swallowing the exit code here.
          pip-audit --strict --desc on

      - name: Secret scanning (trufflehog)
        uses: trufflesecurity/trufflehog@main
        with:
          extra_args: --only-verified

      - name: SBOM generation
        run: |
          pip install cyclonedx-bom
          cyclonedx-py environment -o sbom.json --format json
          echo "SBOM generated: $(wc -l < sbom.json) lines"

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: backend/sbom.json
